replicaCount: 1
image:
  repository: nexus-ccos
  tag: "0.3.0"
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
service:
  type: ClusterIP
  port: 8080
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
persistence:
  enabled: true
  size: 20Gi
env:
  NEXUS_HOME: /nexus
  NEXUS_DATA: /nexus/data
  WORKFLOW_BACKEND: sqlite
  PYTHONPATH: /opt/nexus
secretEnv: {}
