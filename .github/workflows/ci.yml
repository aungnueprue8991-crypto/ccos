name: CCOS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ccos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check . --exclude storage --exclude observatory/ledger || true
      - name: Ruff format check
        run: ruff format --check . --exclude storage --exclude observatory/ledger || true

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pydantic pydantic-settings rich typer httpx orjson ulid-py pytest pytest-asyncio
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v --tb=short
      - name: Closed-loop smoke
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from hermes.shell import Hermes
          h = Hermes('.')
          assert h.health().status == 'healthy'
          assert h.ledger.verify_chain()
          print('smoke OK', h.status()['total_events'])
          "

  constitutional:
    name: Constitutional invariants
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pydantic pydantic-settings rich typer httpx orjson ulid-py
      - name: Run invariant monitor
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from hermes.shell import Hermes
          from constitution.invariants import InvariantMonitor
          h = Hermes('.')
          results = InvariantMonitor(h.ledger).run_all()
          for r in results:
              print(r.invariant_id, r.passed, r.message)
          assert all(r.passed for r in results), 'constitutional invariants failed'
          print('ALL INVARIANTS PASSED')
          "
