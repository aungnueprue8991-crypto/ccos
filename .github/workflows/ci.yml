name: CI
on:
  push:
    branches: [main, production-0.3.0]
  pull_request:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install PyYAML
      - name: CI eval gate
        env:
          NEXUS_DATA: ${{ runner.temp }}/nexus_data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$NEXUS_DATA/workflows"
          python3 scripts/ci_eval_gate.py
      - name: Doctor
        env:
          NEXUS_HOME: ${{ runner.temp }}/nexus_home
          NEXUS_DATA: ${{ runner.temp }}/nexus_home/data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 scripts/nexus setup --quick
          python3 scripts/nexus doctor
